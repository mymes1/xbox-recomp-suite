name: Sonic Heroes Android ARM64

on:
  workflow_dispatch:
    inputs:
      game_release_tag:
        description: "Release tag containing the game asset"
        required: false
        default: "game-data"
      game_asset:
        description: "ISO or ZIP containing default.xbe"
        required: false
        default: "sonic-heroes.iso"
      game_iso_url:
        description: "Optional direct download URL (overrides release asset)"
        required: false
        default: ""
      render_percent:
        description: "Initial render scale (50-100)"
        required: false
        default: "75"
      fps_cap:
        description: "FPS cap: 60, 90, 120 or 0"
        required: false
        default: "60"
      power_mode:
        description: "0 balanced, 1 performance, 2 powersave"
        required: false
        default: "1"
      dynamic_resolution:
        description: "Enable dynamic resolution"
        type: boolean
        required: false
        default: true
      precise_pacing:
        description: "Enable precise frame pacing"
        type: boolean
        required: false
        default: true

concurrency:
  group: sonic-heroes-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Recompile Sonic Heroes for Android
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ANDROID SDK

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "16.0"
          accept-android-sdk-licenses: true

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK environment variable is missing"
            exit 1
          fi

          echo "SDK location: $SDK"

          mapfile -t MANAGERS < <(
            find "$SDK/cmdline-tools" \
              -maxdepth 3 -type f \
              -name sdkmanager 2>/dev/null
          )

          if [ "${#MANAGERS[@]}" -eq 0 ]; then
            echo "::error::Cannot find sdkmanager"
            find "$SDK/cmdline-tools" -maxdepth 4 -print
            exit 1
          fi

          SDKMANAGER="${MANAGERS[0]}"

          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" --version

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Installed SDK packages:"
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed

      # LINUX BUILD DEPENDENCIES

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            wget \
            unzip \
            zip \
            file \
            ca-certificates \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libgl1-mesa-dev

          # Use the packaged SDL3 development library if available.
          # Otherwise build SDL3 instead of silently using SDL2.

          if sudo apt-get install -y libsdl3-dev; then
            echo "Using Ubuntu SDL3 package"
          else
            echo "Building SDL3 from source"

            git clone \
              --depth 1 \
              --branch release-3.2.10 \
              https://github.com/libsdl-org/SDL.git \
              /tmp/SDL3

            cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=OFF \
              -DSDL_TESTS=OFF \
              -DSDL_TEST_LIBRARY=OFF

            cmake --build /tmp/SDL3/build --parallel 4
            sudo cmake --install /tmp/SDL3/build
            sudo ldconfig
          fi

          clang --version
          clang++ --version
          cmake --version
          ninja --version
          pkg-config --modversion sdl3

      # FETCH GAME DATA

      - name: Download Sonic Heroes game image
        env:
          GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.game_release_tag }}
          GAME_ASSET: ${{ inputs.game_asset }}
          GAME_ISO_URL: ${{ inputs.game_iso_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ports/SonicHeroes/assets

          INPUT="ports/SonicHeroes/assets/game-input"

          if [ -n "$GAME_ISO_URL" ]; then
            echo "Downloading supplied game URL"

            curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$INPUT" \
              "$GAME_ISO_URL"
          else
            echo "Downloading release asset: $GAME_ASSET"

            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$GAME_ASSET" \
              --output "$INPUT"
          fi

          if [ ! -s "$INPUT" ]; then
            echo "::error::Downloaded game image is missing or empty"
            exit 1
          fi

          file "$INPUT"
          ls -lh "$INPUT"

          if file "$INPUT" | grep -qi 'zip archive'; then

            echo "Extracting game archive"

            mkdir -p ports/SonicHeroes/assets/game-extract

            unzip -q "$INPUT" \
              -d ports/SonicHeroes/assets/game-extract

            XBE=$(find ports/SonicHeroes/assets/game-extract \
              -type f -iname default.xbe -print -quit)

            if [ -z "$XBE" ]; then
              echo "::error::No default.xbe found in ZIP"
              exit 1
            fi

            GAME_DIR=$(dirname "$XBE")

            cp -a "$GAME_DIR"/. ports/SonicHeroes/assets/

            rm -rf ports/SonicHeroes/assets/game-extract
            rm -f "$INPUT"

          else

            mv "$INPUT" \
              ports/SonicHeroes/assets/sonic-heroes.iso

          fi

          echo "Game data prepared:"
          ls -lah ports/SonicHeroes/assets

      # PREPARE RECOMPILATION

      - name: Validate build tools and game data
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/prepare.py
          test -f tools/build_android.py
          test -f ports/SonicHeroes/build.sh

          python3 --version

          echo "Checking game input"

          if [ ! -f ports/SonicHeroes/assets/sonic-heroes.iso ] && \
             [ ! -f ports/SonicHeroes/assets/default.xbe ]; then

            XBE=$(find ports/SonicHeroes/assets \
              -type f -iname default.xbe -print -quit)

            if [ -z "$XBE" ]; then
              echo "::error::No supported game input found"
              exit 1
            fi
          fi

      - name: Prepare Sonic Heroes port
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/prepare.py SonicHeroes

      - name: Generate recompilation source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ports/SonicHeroes/build.sh

          ports/SonicHeroes/build.sh --generate-only

      # ANDROID ARM64 COMPILATION

      - name: Build Android ARM64 APK
        env:
          RENDER_PERCENT: ${{ inputs.render_percent }}
          FPS_CAP: ${{ inputs.fps_cap }}
          POWER_MODE: ${{ inputs.power_mode }}
          DYNAMIC_RESOLUTION: ${{ inputs.dynamic_resolution }}
          PRECISE_PACING: ${{ inputs.precise_pacing }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            SonicHeroes
            --jobs 4
            --render-percent "$RENDER_PERCENT"
            --fps-cap "$FPS_CAP"
            --power-mode "$POWER_MODE"
            --resolution-min 50
            --resolution-max 85
          )

          if [ "$DYNAMIC_RESOLUTION" != "true" ]; then
            ARGS+=(--no-dynamic-resolution)
          fi

          if [ "$PRECISE_PACING" != "true" ]; then
            ARGS+=(--no-precise-pacing)
          fi

          echo "Starting Android ARM64 compilation"

          python3 tools/build_android.py "${ARGS[@]}"

          echo "APK build command completed"

      # VALIDATE OUTPUT

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/SonicHeroes-arm64-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Expected APK was not generated"
            echo "Available output files:"
            find dist -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -20
          fi

      # UPLOAD APK

      - name: Upload Sonic Heroes Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-arm64-debug
          path: dist/SonicHeroes-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-build-diagnostics
          path: |
            ports/SonicHeroes/config/game.toml
            ports/SonicHeroes/PORT_STATUS.md
          if-no-files-found: warn
          retention-days: 30
