
name: Sonic Heroes Android ARM64

on:
  workflow_dispatch:
    inputs:
      game_release_tag:
        description: "Release tag containing game data"
        required: false
        default: "game-data"
      game_asset:
        description: "ISO or ZIP containing default.xbe"
        required: false
        default: "sonic-heroes.iso"
      game_iso_url:
        description: "Optional direct ISO download URL"
        required: false
        default: ""
      render_percent:
        description: "Render scale (50-100)"
        required: false
        default: "75"
      fps_cap:
        description: "FPS cap: 60, 90, 120 or 0"
        required: false
        default: "60"
      power_mode:
        description: "0 balanced, 1 performance, 2 powersave"
        required: false
        default: "1"
      dynamic_resolution:
        description: "Enable dynamic resolution"
        type: boolean
        required: false
        default: true
      precise_pacing:
        description: "Enable precise frame pacing"
        type: boolean
        required: false
        default: true

concurrency:
  group: sonic-heroes-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Recompile and package Sonic Heroes
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      # 1. CHECKOUT

      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. PYTHON

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. JAVA

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. ANDROID SDK
      # Do NOT use android-actions/setup-android here.
      # The hosted runner already has command-line tools 12.0.

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Preinstalled sdkmanager not found"
            find "$SDK/cmdline-tools" -maxdepth 4 -type f \
              -name sdkmanager || true
            exit 1
          fi

          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "Using Android SDK:"
          echo "$SDK"

          "$SDKMANAGER" --version

          echo "Accepting SDK licenses"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::SDK license acceptance failed"
            exit 1
          fi

          echo "Installing Android packages"

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "Checking installed packages"

          "$SDKMANAGER" --sdk_root="$SDK" --list_installed

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/36.0.0"
          test -d "$SDK/ndk/28.2.13676358"

          echo "Android SDK is ready"

      # 5. LINUX DEPENDENCIES

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            wget \
            unzip \
            zip \
            file \
            ca-certificates \
            libvulkan-dev \
            libsdl3-dev

          echo "Checking build tools"

          clang --version
          clang++ --version
          cmake --version
          ninja --version
          pkg-config --modversion sdl3

      # 6. FETCH GAME

      - name: Download Sonic Heroes game data
        env:
          GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.game_release_tag }}
          GAME_ASSET: ${{ inputs.game_asset }}
          GAME_ISO_URL: ${{ inputs.game_iso_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ports/SonicHeroes/assets

          INPUT="ports/SonicHeroes/assets/game-input"

          if [ -n "$GAME_ISO_URL" ]; then

            echo "Downloading supplied ISO URL"

            curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              -o "$INPUT" \
              "$GAME_ISO_URL"

          else

            echo "Downloading release asset"

            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$GAME_ASSET" \
              --output "$INPUT"

          fi

          test -s "$INPUT"

          file "$INPUT"
          ls -lh "$INPUT"

          if file "$INPUT" | grep -qi 'zip archive'; then

            echo "Extracting game ZIP"

            mkdir -p ports/SonicHeroes/assets/game-extract

            unzip -q "$INPUT" \
              -d ports/SonicHeroes/assets/game-extract

            XBE=$(find ports/SonicHeroes/assets/game-extract \
              -type f -iname default.xbe -print -quit)

            if [ -z "$XBE" ]; then
              echo "::error::default.xbe not found"
              exit 1
            fi

            GAME_DIR=$(dirname "$XBE")

            cp -a "$GAME_DIR"/. ports/SonicHeroes/assets/

            rm -rf ports/SonicHeroes/assets/game-extract
            rm -f "$INPUT"

          else

            mv "$INPUT" \
              ports/SonicHeroes/assets/sonic-heroes.iso

          fi

          echo "Game assets:"
          ls -lah ports/SonicHeroes/assets

      # 7. VALIDATE REPOSITORY

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/prepare.py
          test -f tools/build_android.py
          test -f ports/SonicHeroes/build.sh

          echo "Project files verified"

          python3 --version

      # 8. PREPARE PORT

      - name: Prepare Sonic Heroes
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/prepare.py SonicHeroes

      # 9. GENERATE RECOMPILATION CODE

      - name: Generate guest recompilation
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ports/SonicHeroes/build.sh

          ports/SonicHeroes/build.sh --generate-only

      # 10. BUILD ANDROID APK

      - name: Build Android ARM64 APK
        env:
          RENDER_PERCENT: ${{ inputs.render_percent }}
          FPS_CAP: ${{ inputs.fps_cap }}
          POWER_MODE: ${{ inputs.power_mode }}
          DYNAMIC_RESOLUTION: ${{ inputs.dynamic_resolution }}
          PRECISE_PACING: ${{ inputs.precise_pacing }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            SonicHeroes
            --jobs 4
            --render-percent "$RENDER_PERCENT"
            --fps-cap "$FPS_CAP"
            --power-mode "$POWER_MODE"
            --resolution-min 50
            --resolution-max 85
          )

          if [ "$DYNAMIC_RESOLUTION" != "true" ]; then
            ARGS+=(--no-dynamic-resolution)
          fi

          if [ "$PRECISE_PACING" != "true" ]; then
            ARGS+=(--no-precise-pacing)
          fi

          echo "Starting ARM64 Android compilation"

          python3 tools/build_android.py "${ARGS[@]}"

          echo "Compilation finished"

      # 11. VERIFY APK

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/SonicHeroes-arm64-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated at expected location"

            find dist -maxdepth 4 -type f -print 2>/dev/null || true

            exit 1
          fi

          echo "APK generated successfully"

          ls -lh "$APK"
          file "$APK"

      # 12. UPLOAD APK

      - name: Upload Sonic Heroes ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-arm64-debug
          path: dist/SonicHeroes-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 13. BUILD DIAGNOSTICS

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-build-diagnostics
          path: |
            ports/SonicHeroes/config/game.toml
            ports/SonicHeroes/PORT_STATUS.md
          if-no-files-found: warn
          retention-days: 30
