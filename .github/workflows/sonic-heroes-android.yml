
name: Sonic Heroes Android

on:
  workflow_dispatch:
    inputs:
      game_release_tag:
        description: "Release tag containing your game archive"
        required: false
        default: "game-data"
      game_asset:
        description: "Release asset: ISO or ZIP containing default.xbe"
        required: false
        default: "sonic-heroes.iso"
      game_iso_url:
        description: "Optional direct download URL (overrides release asset)"
        required: false
        default: ""
      render_percent:
        description: "Initial render scale (50-100)"
        required: false
        default: "75"
      fps_cap:
        description: "Frame cap: 60, 90, 120 or 0"
        required: false
        default: "60"
      power_mode:
        description: "0 balanced, 1 performance, 2 powersave"
        required: false
        default: "1"
      dynamic_resolution:
        description: "Enable dynamic resolution"
        type: boolean
        required: false
        default: true
      precise_pacing:
        description: "Enable precise frame pacing"
        type: boolean
        required: false
        default: true

concurrency:
  group: sonic-heroes-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Recompile and package APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use the runner's installed SDK manager.
      # Do not use setup-android@v3 here: its requested tools download
      # previously returned HTTP 404.
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            echo "ANDROID_SDK_ROOT=$SDK"
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using SDK: $SDK"
          echo "Using sdkmanager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/36.0.0"
          test -d "$SDK/ndk/28.2.13676358"

          echo "Android SDK and NDK installation verified."

      # SDL3 is built from source because libsdl3-dev was unavailable
      # in the previous Ubuntu 24.04 apt install.
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            wget \
            unzip \
            zip \
            file \
            ca-certificates \
            p7zip-full \
            libvulkan-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libudev-dev

          command -v 7z
          clang++ --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Build and install SDL3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch release-3.2.10 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3

          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF

          cmake --build /tmp/SDL3/build --parallel 4

          sudo cmake --install /tmp/SDL3/build
          sudo ldconfig

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"

          pkg-config --modversion sdl3

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "SDL3 installed successfully."

      - name: Download and extract game files
        id: game
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.game_release_tag }}
          GAME_ASSET: ${{ inputs.game_asset }}
          GAME_ISO_URL: ${{ inputs.game_iso_url }}
        run: |
          set -euo pipefail

          ASSETS="ports/SonicHeroes/assets"
          INPUT="$ASSETS/game-input"
          EXTRACT="$ASSETS/game-extract"

          mkdir -p "$ASSETS"
          rm -rf "$INPUT" "$EXTRACT"

          if [ -n "${GAME_ISO_URL:-}" ]; then
            echo "Downloading game archive from supplied URL..."

            curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$INPUT" \
              "$GAME_ISO_URL"
          else
            echo "Downloading $GAME_ASSET from release $RELEASE_TAG..."

            if ! gh release download "$RELEASE_TAG" \
              --pattern "$GAME_ASSET" \
              --output "$INPUT"; then
              echo "::error::Could not download the requested release asset."
              echo "Check the release tag, asset filename and GAME_DATA_TOKEN permissions."
              exit 1
            fi
          fi

          if [ ! -s "$INPUT" ]; then
            echo "::error::Downloaded game file is empty."
            exit 1
          fi

          echo "Downloaded file information:"
          file "$INPUT"
          ls -lh "$INPUT"

          if file "$INPUT" | grep -qi 'zip archive'; then
            echo "ZIP archive detected."

            # Test the complete archive before extracting it.
            # This catches damaged archives and unsupported encryption.
            echo "Testing ZIP archive with 7-Zip..."

            if ! 7z t "$INPUT"; then
              echo "::error::7-Zip could not test this archive."
              echo "The archive may be damaged, encrypted or use an unsupported compression method."
              exit 1
            fi

            mkdir -p "$EXTRACT"

            echo "Extracting archive with 7-Zip..."

            if ! 7z x "$INPUT" "-o$EXTRACT" -y; then
              echo "::error::7-Zip extraction failed."
              exit 1
            fi

            echo "Searching for default.xbe..."

            XBE="$(find "$EXTRACT" -type f -iname 'default.xbe' -print -quit)"

            if [ -z "$XBE" ]; then
              echo "::error::No default.xbe was found in the extracted archive."
              echo "Archive contents:"
              find "$EXTRACT" -maxdepth 4 -type f | head -100
              exit 1
            fi

            GAME_DIR="$(dirname "$XBE")"

            echo "Found game executable: $XBE"
            echo "Copying game directory: $GAME_DIR"

            cp -a "$GAME_DIR"/. "$ASSETS"/

            rm -rf "$EXTRACT"
            rm -f "$INPUT"

          else
            echo "Non-ZIP game image detected."

            mv "$INPUT" "$ASSETS/sonic-heroes.iso"
          fi

          echo "Checking prepared game assets..."
          find "$ASSETS" -maxdepth 2 -type f | head -100

          if [ ! -f "$ASSETS/default.xbe" ] && \
             [ ! -f "$ASSETS/sonic-heroes.iso" ]; then
            echo "::error::Neither default.xbe nor sonic-heroes.iso is present."
            exit 1
          fi

          echo "Game input preparation completed."

      - name: Prepare port and generate recompilation
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/prepare.py SonicHeroes

          ports/SonicHeroes/build.sh --generate-only

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/build_android.py SonicHeroes --jobs 4 \
            --render-percent "${{ inputs.render_percent }}" \
            --fps-cap "${{ inputs.fps_cap }}" \
            --power-mode "${{ inputs.power_mode }}" \
            --resolution-min 50 \
            --resolution-max 85 \
            ${{ inputs.dynamic_resolution && '' || '--no-dynamic-resolution' }} \
            ${{ inputs.precise_pacing && '' || '--no-precise-pacing' }}

          if [ ! -f dist/SonicHeroes-arm64-debug.apk ]; then
            echo "::error::Build finished without producing the expected APK."
            echo "APK files found:"
            find . -type f -name '*.apk' -print
            exit 1
          fi

          ls -lh dist/SonicHeroes-arm64-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-arm64-debug
          path: dist/SonicHeroes-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-build-notes
          path: |
            ports/SonicHeroes/config/game.toml
            ports/SonicHeroes/PORT_STATUS.md
          if-no-files-found: warn
          retention-days: 30
