
name: Sonic Heroes Android ARM64

on:
  workflow_dispatch:
    inputs:
      game_release_tag:
        description: "Release containing game data"
        required: false
        default: "game-data"
      game_asset:
        description: "ISO or ZIP containing default.xbe"
        required: false
        default: "sonic-heroes.iso"
      game_iso_url:
        description: "Optional direct ISO URL"
        required: false
        default: ""
      render_percent:
        description: "Render scale (50-100)"
        required: false
        default: "75"
      fps_cap:
        description: "FPS cap: 60, 90, 120 or 0"
        required: false
        default: "60"
      power_mode:
        description: "0 balanced, 1 performance, 2 powersave"
        required: false
        default: "1"
      dynamic_resolution:
        description: "Enable dynamic resolution"
        type: boolean
        required: false
        default: true
      precise_pacing:
        description: "Enable precise frame pacing"
        type: boolean
        required: false
        default: true

concurrency:
  group: sonic-heroes-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Sonic Heroes Android Build
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      # CHECKOUT

      - name: Checkout repository
        uses: actions/checkout@v4

      # PYTHON

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # JAVA

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ANDROID SDK
      # Use preinstalled command-line tools.
      # Do not request version 16.0 from setup-android.

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            find "$SDK/cmdline-tools" -name sdkmanager -type f
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "SDK: $SDK"
          "$SDKMANAGER" --version

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/36.0.0"
          test -d "$SDK/ndk/28.2.13676358"

          echo "Android SDK ready"

      # LINUX DEPENDENCIES

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            wget \
            unzip \
            zip \
            file \
            ca-certificates \
            libvulkan-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libudev-dev

          echo "Checking SDL3"

          if ! pkg-config --exists sdl3; then

            echo "SDL3 APT package unavailable."
            echo "Building SDL3 from official source."

            git clone \
              --depth 1 \
              --branch release-3.2.10 \
              https://github.com/libsdl-org/SDL.git \
              /tmp/SDL3

            cmake -S /tmp/SDL3 \
              -B /tmp/SDL3/build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=ON \
              -DSDL_TESTS=OFF \
              -DSDL_TEST_LIBRARY=OFF

            cmake --build /tmp/SDL3/build --parallel 4

            sudo cmake --install /tmp/SDL3/build
            sudo ldconfig

          fi

          echo "Checking compiler"

          clang --version
          clang++ --version
          cmake --version
          ninja --version

          echo "Checking SDL3"

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"

          pkg-config --modversion sdl3
          pkg-config --cflags --libs sdl3

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

          echo "Linux dependencies ready"

      # GAME DATA

      - name: Download Sonic Heroes game
        env:
          GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.game_release_tag }}
          GAME_ASSET: ${{ inputs.game_asset }}
          GAME_ISO_URL: ${{ inputs.game_iso_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ports/SonicHeroes/assets

          INPUT="ports/SonicHeroes/assets/game-input"

          if [ -n "$GAME_ISO_URL" ]; then

            echo "Downloading supplied game URL"

            curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              -o "$INPUT" \
              "$GAME_ISO_URL"

          else

            echo "Downloading release asset"

            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$GAME_ASSET" \
              --output "$INPUT"

          fi

          test -s "$INPUT"

          file "$INPUT"
          ls -lh "$INPUT"

          if file "$INPUT" | grep -qi 'zip archive'; then

            echo "Extracting ZIP"

            mkdir -p ports/SonicHeroes/assets/game-extract

            unzip -q "$INPUT" \
              -d ports/SonicHeroes/assets/game-extract

            XBE=$(find ports/SonicHeroes/assets/game-extract \
              -type f -iname default.xbe -print -quit)

            if [ -z "$XBE" ]; then
              echo "::error::default.xbe not found"
              exit 1
            fi

            GAME_DIR=$(dirname "$XBE")

            cp -a "$GAME_DIR"/. ports/SonicHeroes/assets/

            rm -rf ports/SonicHeroes/assets/game-extract
            rm -f "$INPUT"

          else

            mv "$INPUT" \
              ports/SonicHeroes/assets/sonic-heroes.iso

          fi

          echo "Game assets:"
          ls -lah ports/SonicHeroes/assets

      # PROJECT VALIDATION

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/prepare.py
          test -f tools/build_android.py
          test -f ports/SonicHeroes/build.sh

          echo "Project files found"

          python3 --version

      # PREPARE

      - name: Prepare Sonic Heroes
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/prepare.py SonicHeroes

      # GENERATE

      - name: Generate recompilation source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ports/SonicHeroes/build.sh

          ports/SonicHeroes/build.sh --generate-only

      # BUILD APK

      - name: Build Android ARM64 APK
        env:
          RENDER_PERCENT: ${{ inputs.render_percent }}
          FPS_CAP: ${{ inputs.fps_cap }}
          POWER_MODE: ${{ inputs.power_mode }}
          DYNAMIC_RESOLUTION: ${{ inputs.dynamic_resolution }}
          PRECISE_PACING: ${{ inputs.precise_pacing }}
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            SonicHeroes
            --jobs 4
            --render-percent "$RENDER_PERCENT"
            --fps-cap "$FPS_CAP"
            --power-mode "$POWER_MODE"
            --resolution-min 50
            --resolution-max 85
          )

          if [ "$DYNAMIC_RESOLUTION" != "true" ]; then
            ARGS+=(--no-dynamic-resolution)
          fi

          if [ "$PRECISE_PACING" != "true" ]; then
            ARGS+=(--no-precise-pacing)
          fi

          echo "Building Sonic Heroes Android ARM64"

          python3 tools/build_android.py "${ARGS[@]}"

          echo "Build command completed"

      # APK VALIDATION

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/SonicHeroes-arm64-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK not found"

            find dist -maxdepth 4 -type f -print 2>/dev/null || true

            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"
          file "$APK"

      # UPLOAD

      - name: Upload Sonic Heroes APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-arm64-debug
          path: dist/SonicHeroes-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

      # DIAGNOSTICS

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-build-diagnostics
          path: |
            ports/SonicHeroes/config/game.toml
            ports/SonicHeroes/PORT_STATUS.md
          if-no-files-found: warn
          retention-days: 30
