
name: Sonic Heroes Android

on:
  workflow_dispatch:
    inputs:
      game_release_tag:
        description: "Release tag containing your game archive"
        required: false
        default: "game-data"
      game_asset:
        description: "Release asset (.iso or .zip containing game files/an ISO)"
        required: false
        default: "sonic-heroes.iso"
      game_iso_url:
        description: "Optional direct download URL (overrides release asset)"
        required: false
        default: ""
      render_percent:
        description: "Initial render scale (50-100)"
        required: false
        default: "75"
      fps_cap:
        description: "Frame cap (60, 90, 120 or 0)"
        required: false
        default: "60"
      power_mode:
        description: "0 balanced, 1 performance, 2 powersave"
        required: false
        default: "1"
      dynamic_resolution:
        description: "Enable dynamic resolution"
        type: boolean
        required: false
        default: true
      precise_pacing:
        description: "Enable precise frame pacing"
        type: boolean
        required: false
        default: true

concurrency:
  group: sonic-heroes-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Recompile and package Sonic Heroes ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      # -------------------------------------------------------
      # Checkout and language toolchains
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------------------------------------
      # Android SDK
      # Use the SDK manager already installed on the runner.
      # Avoid setup-android requesting the unavailable 16.0 ZIP.
      # -------------------------------------------------------

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "SDK: $SDK"
          echo "SDK manager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/36.0.0"
          test -f "$SDK/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"

          echo "Android SDK and NDK verified."

      # -------------------------------------------------------
      # Linux dependencies
      # -------------------------------------------------------

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            gh \
            curl \
            wget \
            unzip \
            zip \
            file \
            ca-certificates \
            p7zip-full \
            libvulkan-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libudev-dev

          command -v 7z
          command -v gh
          clang++ --version | head -1
          cmake --version | head -1
          ninja --version
          pkg-config --exists vulkan

      # -------------------------------------------------------
      # SDL3
      # Ubuntu 24.04 does not provide the libsdl3-dev package
      # used by the old workflow.
      # -------------------------------------------------------

      - name: Build and install SDL3
        shell: bash
        run: |
          set -Eeuo pipefail

          git clone --depth 1 \
            --branch release-3.2.10 \
            https://github.com/libsdl-org/SDL.git \
            /tmp/SDL3

          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF

          cmake --build /tmp/SDL3/build --parallel 4

          sudo cmake --install /tmp/SDL3/build
          sudo ldconfig

          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"

          pkg-config --modversion sdl3

          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Download and normalize the game input
      #
      # Supports:
      # 1. ZIP containing default.xbe and DVD/
      # 2. ZIP containing a uniquely named XBE
      # 3. ZIP containing an ISO/XISO
      # 4. Direct ISO/XISO download
      #
      # It never uploads game files as build artifacts.
      # -------------------------------------------------------

      - name: Download and prepare game files
        id: game
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GAME_DATA_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.game_release_tag }}
          GAME_ASSET: ${{ inputs.game_asset }}
          GAME_ISO_URL: ${{ inputs.game_iso_url }}
        run: |
          set -Eeuo pipefail

          ASSETS="ports/SonicHeroes/assets"
          INPUT="$ASSETS/game-input"
          STAGE="$ASSETS/game-extract"

          mkdir -p "$ASSETS"
          rm -rf "$INPUT" "$STAGE"

          echo "=== Downloading game input ==="

          if [ -n "${GAME_ISO_URL:-}" ]; then
            echo "Using supplied download URL."

            curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --output "$INPUT" \
              "$GAME_ISO_URL"
          else
            echo "Release: $RELEASE_TAG"
            echo "Asset: $GAME_ASSET"

            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$GAME_ASSET" \
              --output "$INPUT"
          fi

          test -s "$INPUT" || {
            echo "::error::Downloaded game file is empty."
            exit 1
          }

          echo "=== Download information ==="
          file "$INPUT"
          ls -lh "$INPUT"

          FILE_INFO="$(file -b "$INPUT")"
          LOWER_ASSET="${GAME_ASSET,,}"

          # ---------------------------------------------------
          # ZIP archive
          # ---------------------------------------------------

          if echo "$FILE_INFO" | grep -qi 'zip archive'; then

            echo "ZIP archive detected."

            if ! 7z t "$INPUT"; then
              echo "::error::The ZIP archive failed its integrity test."
              echo "It may be damaged, encrypted or use an unsupported codec."
              exit 1
            fi

            mkdir -p "$STAGE"

            7z x "$INPUT" "-o$STAGE" -y

            echo "=== Searching for XBE ==="

            XBE="$(find "$STAGE" -type f -iname 'default.xbe' -print -quit)"

            # If the executable has another name, accept it only
            # when exactly one XBE exists.
            if [ -z "$XBE" ]; then
              mapfile -t XBES < <(
                find "$STAGE" -type f -iname '*.xbe' -print | sort
              )

              if [ "${#XBES[@]}" -eq 1 ]; then
                XBE="${XBES[0]}"
                echo "Using the only XBE found: $XBE"
              elif [ "${#XBES[@]}" -gt 1 ]; then
                echo "::error::Multiple XBE files found but none is named default.xbe."
                printf '%s\n' "${XBES[@]}"
                exit 1
              fi
            fi

            if [ -n "$XBE" ]; then

              echo "Found executable: $XBE"

              # Copy the complete game folder, not just the XBE.
              GAME_DIR="$(dirname "$XBE")"

              # Prefer the nearest parent containing the DVD folder.
              SEARCH_DIR="$GAME_DIR"

              while [ "$SEARCH_DIR" != "$STAGE" ]; do
                if [ -d "$SEARCH_DIR/DVD" ] || [ -d "$SEARCH_DIR/dvd" ]; then
                  GAME_DIR="$SEARCH_DIR"
                  break
                fi

                PARENT="$(dirname "$SEARCH_DIR")"

                if [ "$PARENT" = "$SEARCH_DIR" ]; then
                  break
                fi

                SEARCH_DIR="$PARENT"
              done

              echo "Game directory: $GAME_DIR"

              cp -a "$GAME_DIR"/. "$ASSETS"/

              # Normalize alternate executable names.
              if [ ! -s "$ASSETS/default.xbe" ]; then
                cp "$XBE" "$ASSETS/default.xbe"
              fi

            else

              # -------------------------------------------------
              # No XBE: look for an ISO inside the ZIP.
              # -------------------------------------------------

              echo "No XBE found. Searching for nested disc images."

              mapfile -t ISOS < <(
                find "$STAGE" -type f \
                  \( -iname '*.iso' -o -iname '*.xiso' -o -iname '*.img' \) \
                  -print | sort
              )

              if [ "${#ISOS[@]}" -eq 1 ]; then
                echo "Found disc image: ${ISOS[0]}"
                cp "${ISOS[0]}" "$ASSETS/sonic-heroes.iso"

              elif [ "${#ISOS[@]}" -gt 1 ]; then
                echo "::error::Multiple disc images found. Supply one game image."
                printf '%s\n' "${ISOS[@]}"
                exit 1

              else
                echo "::error::Archive contains neither default.xbe nor an ISO."
                echo "Archive file listing:"
                find "$STAGE" -maxdepth 5 -type f | head -200
                exit 1
              fi
            fi

            rm -rf "$STAGE"
            rm -f "$INPUT"

          # ---------------------------------------------------
          # Raw ISO/XISO
          # ---------------------------------------------------

          elif [[ "$LOWER_ASSET" == *.iso ]] || \
               [[ "$LOWER_ASSET" == *.xiso ]] || \
               echo "$FILE_INFO" | grep -Eqi 'ISO 9660|XDVDFS'; then

            echo "Disc image detected."
            mv "$INPUT" "$ASSETS/sonic-heroes.iso"

          else
            echo "::error::Unsupported game input format."
            echo "File information: $FILE_INFO"
            echo "Supply a ZIP containing default.xbe/game files or an ISO."
            exit 1
          fi

          # ---------------------------------------------------
          # Final validation
          # ---------------------------------------------------

          echo "=== Prepared game files ==="

          if [ -s "$ASSETS/default.xbe" ]; then
            echo "Ready: assets/default.xbe"
          elif [ -s "$ASSETS/sonic-heroes.iso" ]; then
            echo "Ready: assets/sonic-heroes.iso"
          else
            echo "::error::No usable XBE or ISO was prepared."
            find "$ASSETS" -maxdepth 3 -type f | head -150
            exit 1
          fi

          echo "=== DVD directory preview ==="
          find "$ASSETS/DVD" -maxdepth 1 -type f 2>/dev/null | head -30 || true

          echo "Game input preparation completed."

      # -------------------------------------------------------
      # Verify files before running the port build.
      # -------------------------------------------------------

      - name: Verify game input
        shell: bash
        run: |
          set -Eeuo pipefail

          ASSETS="ports/SonicHeroes/assets"

          echo "=== XBE files ==="
          find "$ASSETS" -type f -iname '*.xbe' -print || true

          echo "=== ISO files ==="
          find "$ASSETS" -maxdepth 2 -type f -iname '*.iso' -print || true

          if [ ! -s "$ASSETS/default.xbe" ] && \
             [ ! -s "$ASSETS/sonic-heroes.iso" ]; then
            echo "::error::Game input verification failed."
            exit 1
          fi

          echo "Game input passed verification."

      # -------------------------------------------------------
      # Generate guest code
      # -------------------------------------------------------

      - name: Prepare port and recompile guest code
        timeout-minutes: 150
        shell: bash
        run: |
          set -Eeuo pipefail
          set -x

          python3 tools/prepare.py SonicHeroes

          chmod +x ports/SonicHeroes/build.sh

          ports/SonicHeroes/build.sh --generate-only

          test -s ports/SonicHeroes/assets/default.xbe
          test -s ports/SonicHeroes/generated/game/x86_func_mapping.cpp

          echo "Guest recompilation completed."

      # -------------------------------------------------------
      # Build Android ARM64 APK
      # -------------------------------------------------------

      - name: Build Android ARM64 APK
        timeout-minutes: 150
        shell: bash
        env:
          RENDER_PERCENT: ${{ inputs.render_percent }}
          FPS_CAP: ${{ inputs.fps_cap }}
          POWER_MODE: ${{ inputs.power_mode }}
          DYNAMIC_RESOLUTION: ${{ inputs.dynamic_resolution }}
          PRECISE_PACING: ${{ inputs.precise_pacing }}
        run: |
          set -Eeuo pipefail
          set -x

          ARGS=(
            SonicHeroes
            --jobs 4
            --render-percent "$RENDER_PERCENT"
            --fps-cap "$FPS_CAP"
            --power-mode "$POWER_MODE"
            --resolution-min 50
            --resolution-max 85
          )

          if [ "$DYNAMIC_RESOLUTION" != "true" ]; then
            ARGS+=(--no-dynamic-resolution)
          fi

          if [ "$PRECISE_PACING" != "true" ]; then
            ARGS+=(--no-precise-pacing)
          fi

          python3 tools/build_android.py "${ARGS[@]}"

          APK="dist/SonicHeroes-arm64-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Expected APK was not produced."
            find dist -maxdepth 2 -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"

      # -------------------------------------------------------
      # Upload APK
      # -------------------------------------------------------

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-arm64-debug
          path: dist/SonicHeroes-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------
      # Diagnostics only. Never upload the game files.
      # -------------------------------------------------------

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SonicHeroes-build-diagnostics
          path: |
            ports/SonicHeroes/config/game.toml
            ports/SonicHeroes/PORT_STATUS.md
            ports/SonicHeroes/out/build/
            ports/SonicHeroes/generated/game/
          if-no-files-found: warn
          retention-days: 7
